<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinema — Home</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/home.css" />
  </head>
  <body class="home-page">
    <header class="home-header">
      <div class="home-header__location">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="22"
          height="22"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"
          />
        </svg>
        <span id="header-location">Detecting…</span>
      </div>
      <div class="home-header__search-wrap">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
          />
        </svg>
        <label class="sr-only" for="header-search">Search titles</label>
        <input
          id="header-search"
          class="home-header__search"
          type="search"
          placeholder="Search movies, events…"
          autocomplete="off"
        />
      </div>
      <div class="home-header__actions">
        <button type="button" class="btn-ghost" id="sign-out-btn">Sign out</button>
      </div>
    </header>

    <nav class="ribbon" aria-label="Entertainment categories">
      <button
        type="button"
        class="ribbon__tab ribbon__tab--active"
        data-category-tab="movies"
        aria-selected="true"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m15.75 10.5 4.72-4.72a.75.75 0 0 1 1.28.53v11.38a.75.75 0 0 1-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 0 0 2.25-2.25v-9a2.25 2.25 0 0 0-2.25-2.25h-9A2.25 2.25 0 0 0 2.25 7.5v9a2.25 2.25 0 0 0 2.25 2.25Z" />
        </svg>
        Movies
      </button>
      <button type="button" class="ribbon__tab" data-category-tab="events" aria-selected="false">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456ZM16.894 20.567 16.5 21.75l-.394-1.183a2.25 2.25 0 0 0-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 0 0 1.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 0 0 1.423 1.423l1.183.394-1.183.394a2.25 2.25 0 0 0-1.423 1.423Z" />
        </svg>
        Events
      </button>
      <button type="button" class="ribbon__tab" data-category-tab="plays" aria-selected="false">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 18v-5.25m0 0a6.01 6.01 0 0 0 1.5-.189m-1.5.189a6.01 6.01 0 0 1-1.5-.189m3.75 7.478a12.06 12.06 0 0 1-4.5 0m3.75.478a12.06 12.06 0 0 0 4.5 0M8.25 6.75h12M8.25 6.75a3 3 0 0 0-3 3v.75M8.25 6.75a3 3 0 0 1-3 3v.75m15-3.75a3 3 0 0 1 3 3v.75m-3-3a3 3 0 0 0-3 3v.75m3-3h-12m12 0v.75m0 0v.75m0-.75h-12m12 0h-12" />
        </svg>
        Plays
      </button>
      <button type="button" class="ribbon__tab" data-category-tab="sports" aria-selected="false">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 18.75h-9m9 0a3 3 0 0 1 3 3h-15a3 3 0 0 1 3-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.007 0H9.497m5.007 0a7.454 7.454 0 0 1-.982-3.172M9.497 14.25a7.454 7.454 0 0 0 .981-3.172M5.25 4.236c-.982.143-1.857.518-2.344 1.13a48.065 48.065 0 0 0-.083 4.009A11.25 11.25 0 0 0 12.75 21h.75a11.25 11.25 0 0 0 11.25-11.25c0-1.355-.24-2.655-.683-3.855" />
        </svg>
        Sports
      </button>
    </nav>

    <div class="carousel-wrap">
      <div id="trending-carousel" class="carousel" aria-live="polite"></div>
    </div>

    <div class="home-main">
      <div class="filters-mobile-bar">
        <h2 class="section-title filters-mobile-bar__title">Browse</h2>
        <button
          type="button"
          class="btn-ghost"
          id="filters-toggle"
          aria-expanded="false"
          aria-controls="filter-panel"
        >
          Filters
        </button>
      </div>

      <aside class="filter-panel" id="filter-panel">
        <div class="filter-panel__inner">
          <section class="accordion accordion--open" data-accordion>
            <button type="button" class="accordion__trigger" data-accordion-trigger aria-expanded="true">
              Language
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 9l6 6 6-6" />
              </svg>
            </button>
            <div class="accordion__body" data-accordion-body>
              <div id="filter-language" class="filter-chips"></div>
            </div>
          </section>
          <section class="accordion accordion--open" data-accordion>
            <button type="button" class="accordion__trigger" data-accordion-trigger aria-expanded="true">
              Genre
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 9l6 6 6-6" />
              </svg>
            </button>
            <div class="accordion__body" data-accordion-body>
              <div id="filter-genre" class="filter-chips"></div>
            </div>
          </section>
          <section class="accordion accordion--open" data-accordion>
            <button type="button" class="accordion__trigger" data-accordion-trigger aria-expanded="true">
              Age rating
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 9l6 6 6-6" />
              </svg>
            </button>
            <div class="accordion__body" data-accordion-body>
              <div id="filter-age" class="filter-chips"></div>
            </div>
          </section>
        </div>
      </aside>

      <section class="content-area" aria-label="Listings">
        <h2 class="section-title home-only-desktop">Browse</h2>
        <div id="content-grid" class="content-grid"></div>
      </section>
    </div>

    <script type="module">
      import { initHome } from "./js/home.js";
      document.getElementById("sign-out-btn")?.addEventListener("click", () => {
        sessionStorage.removeItem("cinema_customer_session");
        window.location.href = "index.html";
      });
      initHome();
    </script>
  </body>
</html>

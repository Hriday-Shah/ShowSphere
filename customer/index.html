<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/login.css?v=6" />
  </head>
  <body>
    <div class="login-page">
      <div class="login-page__bg" aria-hidden="true"></div>
      <main class="login-card">
        <header class="login-card__brand">
          <h1 class="login-card__logo">Create account</h1>
          <p class="login-card__tagline">Start booking shows in your city.</p>
        </header>
        <form id="signup-form" novalidate>
          <div class="login-field">
            <label for="signup-email">Email</label>
            <input
              id="signup-email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            />
          </div>
          <div class="login-field">
            <label for="signup-password">Password</label>
            <input
              id="signup-password"
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="••••••••"
              minlength="6"
              required
            />
          </div>
          <div class="login-field">
            <label for="signup-password-confirm">Confirm password</label>
            <input
              id="signup-password-confirm"
              name="password-confirm"
              type="password"
              autocomplete="new-password"
              placeholder="••••••••"
              minlength="6"
              required
            />
          </div>
          <button type="submit" class="login-card__submit">Create account</button>
        </form>
        <footer class="login-card__footer">
          <span>Already registered?</span>
          <a class="link" href="login.html">Sign in</a>
        </footer>
      </main>
    </div>
    <script type="module" src="js/signup.js"></script>
  </body>
</html>

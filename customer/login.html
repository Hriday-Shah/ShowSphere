<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/login.css?v=6" />
  </head>
  <body>
    <div class="login-page">
      <div class="login-page__bg" aria-hidden="true"></div>
      <main class="login-card">
        <header class="login-card__brand">
          <h1 class="login-card__logo">Sign in</h1>
          <p class="login-card__tagline">Welcome back. Pick up where you left off.</p>
        </header>
        <form id="login-form" novalidate>
          <div class="login-field">
            <label for="login-email">Email</label>
            <input
              id="login-email"
              name="email"
              type="email"
              autocomplete="username"
              placeholder="you@example.com"
              required
            />
          </div>
          <div class="login-field">
            <label for="login-password">Password</label>
            <input
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="••••••••"
              required
            />
          </div>
          <button type="submit" class="login-card__submit">Sign in</button>
        </form>
        <footer class="login-card__footer">
          <span>New here?</span>
          <a class="link" href="index.html">Create an account</a>
        </footer>
      </main>
    </div>
    <script type="module" src="js/login.js"></script>
  </body>
</html>
